module_name: ekf2
parameters:
- group: EKF2
  definitions:
    EKF2_MULTI_IMU:
      description:
        short: Multi-EKF IMUs
        long: Maximum number of IMUs to use for Multi-EKF. Set 0 to disable. Requires
          SENS_IMU_MODE 0.
      type: int32
      default: 0
      reboot_required: true
      min: 0
      max: 4
    EKF2_MULTI_MAG:
      description:
        short: Multi-EKF Magnetometers
        long: Maximum number of magnetometers to use for Multi-EKF. Set 0 to disable.
          Requires SENS_MAG_MODE 0.
      type: int32
      default: 0
      reboot_required: true
      min: 0
      max: 4
    EKF2_GNSS_DENIED:
      description:
        short: Enable GNSS-denied estimator instances
        long: When enabled, additional EKF2 instances are spawned that run without
          GPS aiding. This doubles the number of estimator instances (e.g. 3 IMUs
          becomes 6 instances - 3 normal + 3 GNSS-denied). Requires SENS_IMU_MODE 0.
      type: int32
      default: 0
      reboot_required: true
      min: 0
      max: 1
      values:
        0: Disabled
        1: Enabled
