module_name: ekf2
parameters:
- group: EKF2
  definitions:
    EKF2_MULTI_IMU:
      description:
        short: Multi-EKF IMUs
        long: Maximum number of IMUs to use for Multi-EKF. Set 0 to disable. Requires
          SENS_IMU_MODE 0.
      type: int32
      default: 0
      reboot_required: true
      min: 0
      max: 4
    EKF2_MULTI_MAG:
      description:
        short: Multi-EKF Magnetometers
        long: Maximum number of magnetometers to use for Multi-EKF. Set 0 to disable.
          Requires SENS_MAG_MODE 0.
      type: int32
      default: 0
      reboot_required: true
      min: 0
      max: 4
    EKF2_MAIN_POS:
      description:
        short: Main estimator position estimation flags
        long: Bitmask controlling which position estimation sources are enabled
          for main EKF instances. Main estimators are always selectable.
          Requires SENS_IMU_MODE 0.
      type: bitmask
      default: 127
      reboot_required: true
      min: 0
      max: 127
      bit:
        0: Initialize origin with GNSS
        1: Fuse GNSS while disarmed
        2: Fuse GNSS while armed
        3: Accept external position resets
        4: Fuse auxiliary global position
        5: Fuse vision and optical flow
        6: Fuse fake position
